<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Gluto Engineering — Idee sbagliate nel posto giusto.">
  <title>Gluto Engineering</title>
  <style>
    :root{
      --bg:#070707;
      --panel:#101010;
      --panel2:#161616;
      --text:#f5f5f5;
      --muted:#b7b7b7;
      --red:#e31818;
      --line:#292929;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    body{
      min-height:100svh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px 16px 40px;
      overflow-x:hidden;
      background:
        radial-gradient(circle at 50% -10%, rgba(227,24,24,.18), transparent 34%),
        linear-gradient(180deg,#0c0c0c 0%,#050505 100%);
    }
    .wrap{width:min(100%,560px);text-align:center}
    .logo{
      width:min(92vw,500px);
      max-height:240px;
      object-fit:contain;
      display:block;
      margin:0 auto 12px;
      filter:drop-shadow(0 12px 30px rgba(0,0,0,.45));
    }
    h1{
      margin:4px 0 4px;
      font-size:clamp(28px,8vw,46px);
      line-height:1;
      letter-spacing:-.04em;
      text-transform:uppercase;
    }
    .tagline{
      margin:8px 0 26px;
      color:#d9d9d9;
      font-size:clamp(17px,4.7vw,22px);
      font-style:italic;
      font-weight:700;
    }
    .accent{
      width:88px;height:4px;background:var(--red);
      border-radius:999px;margin:0 auto 26px;
      box-shadow:0 0 20px rgba(227,24,24,.45);
    }
    .links{display:grid;gap:13px}
    .btn{
      display:flex;
      align-items:center;
      gap:15px;
      width:100%;
      min-height:72px;
      padding:14px 18px;
      border:1px solid var(--line);
      border-radius:18px;
      background:linear-gradient(180deg,var(--panel2),var(--panel));
      color:var(--text);
      text-decoration:none;
      text-align:left;
      box-shadow:0 10px 30px rgba(0,0,0,.22);
      transition:transform .15s ease,border-color .15s ease,background .15s ease;
    }
    .btn:hover,.btn:focus-visible{
      transform:translateY(-2px);
      border-color:rgba(227,24,24,.8);
      background:#171717;
      outline:none;
    }
    .ico{
      width:44px;height:44px;min-width:44px;
      display:grid;place-items:center;
      border-radius:12px;
      background:#0b0b0b;
      border:1px solid #262626;
    }
    .ico svg{width:27px;height:27px;display:block}
    .copy{display:flex;flex-direction:column;gap:3px}
    .name{font-weight:900;font-size:20px;letter-spacing:.01em}
    .handle{color:var(--muted);font-size:14px}
    .arrow{margin-left:auto;color:var(--red);font-size:26px;font-weight:900}
    .footer{
      margin-top:26px;color:#7f7f7f;font-size:12px;letter-spacing:.08em;text-transform:uppercase
    }
    .tiny{margin-top:7px;color:#626262;font-size:11px}
    @media (max-width:380px){
      .btn{min-height:66px;padding:12px 14px}
      .name{font-size:18px}
      .ico{width:40px;height:40px;min-width:40px}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="gluto-logo.png" alt="Gluto Engineering">
    <h1>Gluto Engineering</h1>
    <div class="tagline">Idee sbagliate nel posto giusto</div>
    <div class="accent"></div>

    <section class="links" aria-label="Social Gluto Engineering">
      <a class="btn" href="https://youtube.com/@glutoengineering" target="_blank" rel="noopener">
        <span class="ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="#ff0033"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1C24 15.9 24 12 24 12s0-3.9-.5-5.8ZM9.6 15.6V8.4l6.3 3.6-6.3 3.6Z"/></svg>
        </span>
        <span class="copy">
          <span class="name">YouTube</span>
          <span class="handle">@glutoengineering</span>
        </span>
        <span class="arrow">›</span>
      </a>

      <a class="btn" href="https://www.instagram.com/glutoengineering" target="_blank" rel="noopener">
        <span class="ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#f5f5f5" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="1" fill="#e31818" stroke="none"/>
          </svg>
        </span>
        <span class="copy">
          <span class="name">Instagram</span>
          <span class="handle">@glutoengineering</span>
        </span>
        <span class="arrow">›</span>
      </a>

      <a class="btn" href="https://www.tiktok.com/@gluto.engineering" target="_blank" rel="noopener">
        <span class="ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="#f5f5f5"><path d="M16.7 3c.4 2.2 1.7 3.5 3.9 3.7v3.2c-1.5 0-2.8-.5-3.9-1.3v6.5c0 4.1-3.3 6.9-7.2 6.1-2.6-.5-4.6-2.8-4.7-5.4-.2-3.7 2.8-6.7 6.5-6.7.3 0 .6 0 .9.1v3.3c-.3-.1-.6-.2-.9-.2-1.8 0-3.2 1.5-3.2 3.3 0 2.1 2 3.7 4 3.1 1.3-.4 2.2-1.7 2.2-3.1V3h2.4Z"/></svg>
        </span>
        <span class="copy">
          <span class="name">TikTok</span>
          <span class="handle">@gluto.engineering</span>
        </span>
        <span class="arrow">›</span>
      </a>
    </section>

    <div class="footer">RX-8 • Turbo • Elettronica • Meccanica • Idee discutibili</div>
    <div class="tiny">@glutoengineering</div>
  </main>
</body>
</html>
